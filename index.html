<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Minecraft 1.12 · Time-Limited</title>
  <link rel="icon" type="image/png" href="7878.png" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #fff; }
    #frame {
      position: fixed; inset: 0; width: 100%; height: 100%;
      border: 0; display: block; background: #000;
    }
    /* Countdown chip at the top-right corner */
    #timerChip {
      position: fixed; top: 12px; right: 14px; z-index: 9000;
      font: 600 14px/1 "JetBrains Mono", Consolas, "Microsoft YaHei", monospace;
      color: #fff; background: rgba(0,0,0,.45);
      padding: 7px 12px; border-radius: 8px;
      pointer-events: none; user-select: none;
      backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
    }
    /* When time is up: full-screen white overlay covering and stopping the game */
    #whiteScreen {
      position: fixed; inset: 0; z-index: 99999;
      background: #fff;
      display: none; align-items: center; justify-content: center;
    }
    #whiteScreen.show { display: flex; }
    #whiteMsg {
      color: #bbb; font: 15px/1.8 "Microsoft YaHei", sans-serif;
      text-align: center; padding: 0 20px;
    }
    /* Optional: when pass is set, show a "Restart Timer" entry (password required) */
    #restartBox {
      position: fixed; bottom: 20px; right: 20px; z-index: 100000;
      display: none; text-align: right;
    }
    #restartBox.show { display: block; }
    #restartBox input {
      width: 110px; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px;
    }
    #restartBox button {
      padding: 6px 12px; border: 0; border-radius: 6px;
      background: #e1b741; color: #222; font-size: 13px; cursor: pointer; margin-left: 6px;
    }
  </style>
</head>
<body>
  <!-- Game itself (same as the launcher: wasm / js build) -->
  <iframe id="frame" allow="fullscreen; autoplay" referrerpolicy="no-referrer"></iframe>

  <!-- Countdown chip: hide with timer=0 -->
  <div id="timerChip">--:--</div>

  <!-- White-screen overlay when time is up (plain white by default; add a line of text with msg=) -->
  <div id="whiteScreen"><div id="whiteMsg"></div></div>

  <!-- Optional restart entry (requires pass= password) -->
  <div id="restartBox">
    <input id="passInput" type="password" placeholder="Password" autocomplete="off" />
    <button id="restartBtn" type="button">Restart Timer</button>
  </div>

  <script>
  (function () {
    'use strict';
    function qs(name, def) {
      try {
        var v = new URLSearchParams(location.search).get(name);
        return v === null ? def : v;
      } catch (e) { return def; }
    }

    /* ============ Parameters ============
     * min   time limit in minutes (default 1, decimals allowed, e.g. 1.5 = 1 min 30 s)
     * sec   extra seconds (default 0)
     * build game build: wasm (default) / js
     * boost performance mod: 1 (default) / 0
     * timer show countdown: 1 (default) / 0
     * msg   one line of text shown on the white screen (empty = plain white)
     * pass  password required to restart the timer (empty = no restart entry)
     * reset 1 clears the stored timer and starts over (for parents)
     * Example: index.html?min=45&build=wasm&msg=Time is up, take a break
     */
    var MIN   = Math.max(0, parseFloat(qs('min', '2')) || 0);
    var SEC   = Math.max(0, parseInt(qs('sec', '0'), 10) || 0);
    var BUILD = qs('build', 'wasm') === 'js' ? 'js' : 'wasm';
    var BOOST = qs('boost', '1') === '0' ? '0' : '1';
    var SHOW_TIMER = qs('timer', '1') !== '0';
    var MSG   = qs('msg', '');
    var PASS  = qs('pass', '');
    var RESET = qs('reset', '0') === '1';

    var TOTAL = Math.max(1, MIN * 60 + SEC); // total seconds
    /* The key includes the duration: changing the duration invalidates the old timer
       and restarts; keeping it the same (kid refreshing the page) keeps the timer */
    var KEY = 'mc112_limit_start_' + TOTAL;
    var done = false;

    /* ---- Read/write timer start: refreshing the page does not reset the timer ---- */
    var start = null;
    try {
      if (RESET) localStorage.removeItem(KEY);
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var t = parseInt(raw, 10);
        if (isFinite(t)) start = t;
      }
    } catch (e) { /* fall back to per-session timing when localStorage is unavailable */ }
    if (start === null) {
      start = Date.now();
      try { localStorage.setItem(KEY, String(start)); } catch (e) {}
    }

    function remaining() { return TOTAL - (Date.now() - start) / 1000; }

    function fmt(sec) {
      sec = Math.max(0, Math.ceil(sec));
      var h = Math.floor(sec / 3600);
      var m = Math.floor((sec % 3600) / 60);
      var s = sec % 60;
      function p(n) { return n < 10 ? '0' + n : '' + n; }
      return h > 0 ? (h + ':' + p(m) + ':' + p(s)) : (p(m) + ':' + p(s));
    }

    /* ---- Time up: full white screen + stop the game ---- */
    function whiteout() {
      if (done) return;
      done = true;
      var frame = document.getElementById('frame');
      try { frame.src = 'about:blank'; } catch (e) {}   // unload the game, stop audio and rendering
      var msgEl = document.getElementById('whiteMsg');
      msgEl.textContent = MSG || '';                     // plain white by default
      document.getElementById('whiteScreen').classList.add('show');
      document.getElementById('timerChip').style.display = 'none';
      if (PASS) document.getElementById('restartBox').classList.add('show');
    }

    function tick() {
      var r = remaining();
      if (r <= 0) { whiteout(); return; }
      if (SHOW_TIMER) {
        document.getElementById('timerChip').textContent = 'Time left ' + fmt(r);
      }
    }

    /* ---- Boot ---- */
    var frame = document.getElementById('frame');
    frame.src = './' + BUILD + '/?boost=' + BOOST;
    document.getElementById('timerChip').style.display = SHOW_TIMER ? '' : 'none';

    tick();
    setInterval(tick, 500);
    /* Re-check immediately when the tab becomes visible again */
    document.addEventListener('visibilitychange', tick);

    /* ---- Optional: restart the timer with a password ---- */
    document.getElementById('restartBtn').addEventListener('click', function () {
      var v = document.getElementById('passInput').value;
      if (v !== PASS) { alert('Wrong password'); return; }
      try { localStorage.removeItem(KEY); } catch (e) {}
      var p = [];
      p.push('reset=1');
      p.push('min=' + MIN);
      p.push('sec=' + SEC);
      p.push('build=' + BUILD);
      p.push('boost=' + BOOST);
      if (!SHOW_TIMER) p.push('timer=0');
      if (MSG) p.push('msg=' + encodeURIComponent(MSG));
      if (PASS) p.push('pass=' + encodeURIComponent(PASS));
      location.href = location.pathname + '?' + p.join('&');
    });
  })();
  </script>
</body>
</html>
